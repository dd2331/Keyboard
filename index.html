<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Test</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f0f;
            --fg: #ffffff;
            --sub: #7c7c7c;
            --error: #ff6b6b;
            --correct: #51cf66;
            --cursor: #4dabf7;
            --success: #69db7c;
        }

        body {
            background: linear-gradient(135deg, var(--bg) 0%, #1a1a1a 100%);
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas#drawing-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: crosshair;
        }

        #main-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            opacity: 1;
            transition: opacity 0.6s ease;
            position: relative;
            z-index: 2;
        }

        #main-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #result-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            position: relative;
            z-index: 2;
        }

        #result-screen.show {
            opacity: 1;
            pointer-events: auto;
        }

        .timer-box {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--cursor);
            background: rgba(15, 15, 15, 0.7);
            padding: 15px 25px;
            border-radius: 8px;
            border: 2px solid var(--cursor);
            backdrop-filter: blur(10px);
            z-index: 3;
            letter-spacing: 1px;
        }

        .timer-label {
            font-size: 0.6rem;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            max-width: 700px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-bottom: 60px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cursor) 0%, var(--success) 100%);
            width: 5%;
            transition: width 0.3s ease;
        }

        .question-counter {
            position: absolute;
            top: 40px;
            right: 40px;
            font-size: 1rem;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            background: rgba(15, 15, 15, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .question-container {
            max-width: 700px;
            width: 100%;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .question-text {
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 40px;
            line-height: 2rem;
            color: var(--fg);
            letter-spacing: 0.3px;
            background: rgba(15, 15, 15, 0.6);
            padding: 25px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option {
            padding: 18px 24px;
            background: rgba(15, 15, 15, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--fg);
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: center;
            user-select: none;
            backdrop-filter: blur(10px);
        }

        .option:hover {
            background: rgba(77, 171, 247, 0.15);
            border-color: var(--cursor);
            transform: translateY(-2px);
        }

        .option.selected {
            background: var(--cursor);
            border-color: var(--cursor);
            color: var(--bg);
        }

        .option.correct {
            background: var(--correct);
            border-color: var(--correct);
            color: var(--bg);
        }

        .option.incorrect {
            background: var(--error);
            border-color: var(--error);
            color: var(--bg);
        }

        .option:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .next-btn {
            margin-top: 50px;
            padding: 12px 28px;
            background: var(--cursor);
            color: var(--bg);
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            opacity: 0.5;
            pointer-events: none;
        }

        .next-btn.enabled {
            opacity: 1;
            pointer-events: auto;
        }

        .next-btn:hover.enabled {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(77, 171, 247, 0.3);
        }

        .next-btn:active {
            transform: translateY(0);
        }

        /* RESULT SCREEN */
        .result-container {
            text-align: center;
            max-width: 800px;
            animation: slideUp 0.5s ease;
            background: rgba(15, 15, 15, 0.8);
            padding: 60px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .result-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 60px;
            letter-spacing: -1px;
        }

        .iq-score-display {
            margin-bottom: 80px;
        }

        .iq-number {
            font-size: 5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--cursor) 0%, var(--success) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .iq-label {
            font-size: 0.9rem;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .iq-category {
            font-size: 1.3rem;
            color: var(--fg);
            margin-top: 30px;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            margin: 70px 0;
        }

        .stat-box {
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--cursor);
        }

        .chart-container {
            margin-top: 60px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #distribution-chart {
            width: 100%;
            height: 300px;
        }

        .retry-btn {
            margin-top: 50px;
            padding: 12px 28px;
            background: var(--cursor);
            color: var(--bg);
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(77, 171, 247, 0.3);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        .description {
            margin-top: 30px;
            font-size: 0.95rem;
            color: var(--sub);
            line-height: 1.6;
        }

        .drawing-hint {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-size: 0.8rem;
            color: var(--sub);
            background: rgba(15, 15, 15, 0.7);
            padding: 12px 20px;
            border-radius: 6px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 3;
        }
    </style>
</head>
<body>

<canvas id="drawing-canvas"></canvas>

<div id="main-screen">
    <div class="timer-box">
        <span class="timer-label">Time</span>
        <span id="timer-display">10:00</span>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
    
    <div class="question-counter">
        <span id="question-number">1</span> / 20
    </div>

    <div class="question-container" id="question-container">
        <div class="question-text" id="question-text"></div>
        <div class="options-grid" id="options-grid"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next</button>
    </div>

    <div class="drawing-hint">
        Left Click to Draw | Right Click to Erase
    </div>
</div>

<div id="result-screen">
    <div class="result-container">
        <div class="result-title">Test Complete</div>
        
        <div class="iq-score-display">
            <div class="iq-number" id="final-iq">0</div>
            <div class="iq-label">Your IQ Score</div>
            <div class="iq-category" id="iq-category">Average</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Correct Answers</div>
                <div class="stat-value" id="correct-count">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Accuracy</div>
                <div class="stat-value" id="accuracy-percent">0%</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="distribution-chart"></canvas>
        </div>

        <div class="description" id="description"></div>

        <button class="retry-btn" onclick="newTest()">Try Again</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script>
    // Drawing Canvas
    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d');
    
    let isDrawing = false;
    let isErasing = false;
    let lastX = 0;
    let lastY = 0;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    canvas.addEventListener('mousedown', (e) => {
        lastX = e.clientX;
        lastY = e.clientY;
        
        if (e.button === 0) { // Left click - draw
            isDrawing = true;
            isErasing = false;
        } else if (e.button === 2) { // Right click - erase
            isDrawing = false;
            isErasing = true;
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing && !isErasing) return;

        const currentX = e.clientX;
        const currentY = e.clientY;

        if (isDrawing) {
            // Draw with red marker
            ctx.strokeStyle = '#ff6b6b';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalCompositeOperation = 'source-over';
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(currentX, currentY);
            ctx.stroke();
        } else if (isErasing) {
            // Erase with large marker
            ctx.globalCompositeOperation = 'destination-out';
            ctx.clearRect(currentX - 25, currentY - 25, 50, 50);
        }

        lastX = currentX;
        lastY = currentY;
    });

    canvas.addEventListener('mouseup', () => {
        isDrawing = false;
        isErasing = false;
    });

    canvas.addEventListener('mouseleave', () => {
        isDrawing = false;
        isErasing = false;
    });

    // Prevent context menu on right click
    canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
    });

    // IQ Test Logic
    const questions = [
        {
            question: "What is the next number in the sequence? 2, 4, 8, 16, ?",
            options: ["24", "32", "28", "36"],
            correct: 1
        },
        {
            question: "If all roses are flowers and some flowers fade quickly, which is true?",
            options: ["All roses fade quickly", "Some roses fade quickly", "No roses fade", "All flowers are roses"],
            correct: 1
        },
        {
            question: "What number is missing? 5, 10, 20, 40, ?, 160",
            options: ["60", "80", "100", "120"],
            correct: 1
        },
        {
            question: "A bat and a ball cost $1.10 total. The bat costs $1 more than the ball. How much does the ball cost?",
            options: ["$0.10", "$0.05", "$0.15", "$0.20"],
            correct: 1
        },
        {
            question: "If you rearrange the letters in 'SILENT', you get?",
            options: ["LISTEN", "STOLEN", "ENLIST", "TINSEL"],
            correct: 2
        },
        {
            question: "What is the next letter? A, C, E, G, I, ?",
            options: ["J", "K", "L", "M"],
            correct: 1
        },
        {
            question: "All rectangles are quadrilaterals. All squares are rectangles. Therefore:",
            options: ["All rectangles are squares", "All squares are quadrilaterals", "No squares are quadrilaterals", "Some quadrilaterals are not rectangles"],
            correct: 1
        },
        {
            question: "What is the missing number? 1, 1, 2, 3, 5, 8, 13, ?",
            options: ["18", "21", "19", "20"],
            correct: 1
        },
        {
            question: "If 3 + 4 = 7 and 5 + 6 = 11, then 7 + 8 = ?",
            options: ["14", "15", "16", "17"],
            correct: 1
        },
        {
            question: "Which word does NOT belong with the others?",
            options: ["Dog", "Cat", "Eagle", "Truck"],
            correct: 3
        },
        {
            question: "What is 144 ÷ 12?",
            options: ["10", "11", "12", "13"],
            correct: 2
        },
        {
            question: "If a triangle has sides 3, 4, and 5, what is its area?",
            options: ["6", "10", "12", "15"],
            correct: 0
        },
        {
            question: "What number multiplied by itself gives 196?",
            options: ["12", "13", "14", "15"],
            correct: 2
        },
        {
            question: "If you have 8 apples and give away 3, then get 5 more, how many do you have?",
            options: ["8", "10", "13", "16"],
            correct: 2
        },
        {
            question: "What is the next in the pattern? 100, 90, 81, 73, ?",
            options: ["64", "65", "66", "67"],
            correct: 2
        },
        {
            question: "Which of these is a prime number?",
            options: ["15", "21", "17", "25"],
            correct: 2
        },
        {
            question: "If a book costs $20 and is on sale for 25% off, what is the price?",
            options: ["$10", "$15", "$18", "$19"],
            correct: 1
        },
        {
            question: "What is the opposite of 'expand'?",
            options: ["Extend", "Contract", "Stretch", "Spread"],
            correct: 1
        },
        {
            question: "How many sides does a hexagon have?",
            options: ["4", "5", "6", "8"],
            correct: 2
        },
        {
            question: "If you flip a coin 3 times, how many possible outcomes are there?",
            options: ["3", "6", "8", "12"],
            correct: 2
        }
    ];

    let currentQuestion = 0;
    let selectedAnswer = null;
    let answers = [];
    let chartInstance = null;
    let testStartTime = null;
    let totalTestTime = 600; // 10 minutes in seconds
    let timerInterval = null;

    const mainScreen = document.getElementById('main-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionText = document.getElementById('question-text');
    const optionsGrid = document.getElementById('options-grid');
    const nextBtn = document.getElementById('next-btn');
    const questionNumber = document.getElementById('question-number');
    const progressFill = document.getElementById('progress-fill');
    const timerDisplay = document.getElementById('timer-display');

    function init() {
        testStartTime = Date.now();
        startTimer();
        loadQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - testStartTime) / 1000);
            const remaining = Math.max(0, totalTestTime - elapsed);
            
            const minutes = Math.floor(remaining / 60);
            const seconds = remaining % 60;
            
            timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            if (remaining <= 0) {
                endTest();
            }
        }, 1000);
    }

    function loadQuestion() {
        const q = questions[currentQuestion];
        questionText.textContent = q.question;
        
        optionsGrid.innerHTML = q.options.map((option, index) => 
            `<button class="option" onclick="selectAnswer(${index})">${option}</button>`
        ).join('');
        
        questionNumber.textContent = currentQuestion + 1;
        progressFill.style.width = ((currentQuestion) / 20) * 100 + '%';
        
        selectedAnswer = null;
        nextBtn.classList.remove('enabled');
    }

    function selectAnswer(index) {
        selectedAnswer = index;
        const options = document.querySelectorAll('.option');
        options.forEach((opt, i) => {
            opt.classList.remove('selected');
            if (i === index) {
                opt.classList.add('selected');
            }
        });
        nextBtn.classList.add('enabled');
    }

    function nextQuestion() {
        if (selectedAnswer === null) return;
        
        answers.push(selectedAnswer);
        currentQuestion++;
        
        if (currentQuestion < 20) {
            loadQuestion();
        } else {
            endTest();
        }
    }

    function calculateIQ() {
        let correct = 0;
        questions.forEach((q, i) => {
            if (answers[i] === q.correct) {
                correct++;
            }
        });
        
        const iq = 50 + (correct * 5);
        return iq;
    }

    function getIQCategory(iq) {
        if (iq >= 130) return "Genius";
        if (iq >= 120) return "Very Superior";
        if (iq >= 110) return "Superior";
        if (iq >= 100) return "High Average";
        if (iq >= 90) return "Average";
        if (iq >= 80) return "Low Average";
        if (iq >= 70) return "Below Average";
        return "Very Low";
    }

    function getDescription(iq) {
        const descriptions = {
            "Genius": "Exceptional intellectual ability. You possess rare cognitive talents and can solve complex problems with ease.",
            "Very Superior": "Outstanding intellectual ability. You demonstrate excellent reasoning and analytical skills.",
            "Superior": "Well above average intelligence. You excel at logical thinking and problem-solving.",
            "High Average": "Above average intelligence. You have strong cognitive abilities and quick comprehension.",
            "Average": "Average intelligence. You have typical cognitive abilities across most domains.",
            "Low Average": "Slightly below average intelligence. You may need more time for complex tasks.",
            "Below Average": "Below average intelligence. You may benefit from additional support in certain areas.",
            "Very Low": "Significantly below average intelligence. Additional support and resources are recommended."
        };
        return descriptions[iq] || descriptions["Average"];
    }

    function endTest() {
        clearInterval(timerInterval);
        mainScreen.classList.add('fade-out');
        resultScreen.classList.add('show');
        
        let correct = 0;
        questions.forEach((q, i) => {
            if (answers[i] === q.correct) {
                correct++;
            }
        });
        
        const iq = calculateIQ();
        const category = getIQCategory(iq);
        const accuracy = Math.round((correct / 20) * 100);
        
        document.getElementById('final-iq').textContent = iq;
        document.getElementById('iq-category').textContent = category;
        document.getElementById('correct-count').textContent = correct;
        document.getElementById('accuracy-percent').textContent = accuracy + '%';
        document.getElementById('description').textContent = getDescription(category);
        
        drawChart(iq, correct);
    }

    function drawChart(userIQ, correct) {
        const canvasElement = document.getElementById('distribution-chart');
        const ctx = canvasElement.getContext('2d');
        
        const iqScores = Array.from({length: 101}, (_, i) => 50 + i);
        const distribution = iqScores.map(score => {
            const mean = 100;
            const stdDev = 15;
            const x = (score - mean) / stdDev;
            return Math.exp(-0.5 * x * x) / (stdDev * Math.sqrt(2 * Math.PI)) * 1000;
        });

        const plugin = {
            id: 'userScoreLine',
            afterDatasetsDraw(chart) {
                const {ctx, chartArea: {left, top, width, height}} = chart;
                const xScale = chart.scales.x;
                const xPos = xScale.getPixelForValue(userIQ);
                
                ctx.save();
                ctx.strokeStyle = '#4dabf7';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(xPos, top);
                ctx.lineTo(xPos, top + height);
                ctx.stroke();
                
                ctx.fillStyle = '#4dabf7';
                ctx.font = "12px 'JetBrains Mono'";
                ctx.textAlign = 'center';
                ctx.fillText('Your Score: ' + userIQ, xPos, top - 10);
                ctx.restore();
            }
        };
        
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: iqScores,
                datasets: [{
                    label: 'IQ Distribution',
                    data: distribution,
                    borderColor: '#7c7c7c',
                    backgroundColor: 'rgba(124, 124, 124, 0.05)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    filler: { propagate: true },
                    userScoreLine: {}
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#7c7c7c', display: false }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#7c7c7c', font: { family: "'JetBrains Mono'" } },
                        min: 50,
                        max: 150
                    }
                }
            },
            plugins: [plugin]
        });
    }

    function newTest() {
        currentQuestion = 0;
        selectedAnswer = null;
        answers = [];
        
        if (chartInstance) {
            chartInstance.destroy();
            chartInstance = null;
        }
        
        if (timerInterval) {
            clearInterval(timerInterval);
        }
        
        // Clear canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        mainScreen.classList.remove('fade-out');
        resultScreen.classList.remove('show');
        
        testStartTime = Date.now();
        startTimer();
        loadQuestion();
    }

    init();
</script>

</body>
</html>
