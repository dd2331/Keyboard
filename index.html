<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Test</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0c0c0e;
            --surface: #131316;
            --border: rgba(255,255,255,0.08);
            --fg: #f0f0f2;
            --sub: #5a5a6e;
            --accent: #4dabf7;
            --green: #69db7c;
            --red: #ff6b6b;
            --warning: #fd7e14;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
        }

        /* screens */
        .screen {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            transition: opacity .5s ease, transform .5s ease;
        }
        .screen.hidden { opacity: 0; pointer-events: none; transform: translateY(16px); }

        /* name entry */
        #name-screen { flex-direction: column; gap: 0; z-index: 10; }

        .name-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 56px 64px 48px;
            width: 440px;
            text-align: center;
        }

        .name-card h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--sub);
            margin-bottom: 12px;
        }

        .name-card .tagline {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--fg);
            margin-bottom: 48px;
        }

        .name-input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1.5px solid var(--border);
            border-radius: 6px;
            padding: 14px 18px;
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            transition: border-color .2s;
            text-align: center;
        }
        .name-input::placeholder { color: var(--sub); }
        .name-input:focus { border-color: var(--accent); }

        .start-btn {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #0c0c0e;
            border: none;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .25s;
        }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(77,171,247,.3); }
        .start-btn:active { transform: translateY(0); }
        .start-btn:disabled { opacity: .35; pointer-events: none; }

        .admin-btn {
            margin-top: 28px;
            background: none;
            border: none;
            color: var(--sub);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: color .2s;
            opacity: .5;
        }
        .admin-btn:hover { color: var(--fg); opacity: 1; }

        /* admin modal */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity .3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 48px 52px;
            width: 560px;
            max-width: 90vw;
            text-align: center;
        }
        .modal-card h2 {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--sub);
            margin-bottom: 32px;
        }
        .modal-error {
            font-size: 0.78rem;
            color: var(--red);
            margin-top: 10px;
            min-height: 18px;
        }
        .modal-close {
            margin-top: 24px;
            background: none;
            border: none;
            color: var(--sub);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .modal-close:hover { color: var(--fg); }

        .admin-panel {
            max-height: 460px;
            overflow-y: auto;
            margin-top: 8px;
        }
        .admin-panel::-webkit-scrollbar { width: 4px; }
        .admin-panel::-webkit-scrollbar-track { background: transparent; }
        .admin-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: left;
        }
        .admin-table th {
            color: var(--sub);
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
        }
        .admin-table td {
            padding: 12px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .admin-table tr:last-child td { border-bottom: none; }
        .iq-badge {
            display: inline-block;
            background: rgba(77,171,247,.12);
            color: var(--accent);
            border-radius: 4px;
            padding: 2px 8px;
            font-weight: 600;
        }
        .tab-switch-badge {
            display: inline-block;
            background: rgba(253,126,20,0.12);
            color: var(--warning);
            border-radius: 4px;
            padding: 2px 8px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .admin-empty {
            color: var(--sub);
            font-size: 0.85rem;
            padding: 24px 0;
        }
        .admin-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .admin-header-row h2 { margin-bottom: 0; }
        .admin-count {
            font-size: 0.7rem;
            color: var(--sub);
            letter-spacing: 1px;
        }

        /* test screen */
        #test-screen { z-index: 2; flex-direction: column; padding: 20px; }

        .hud {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 40px;
            z-index: 5;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .hud-label {
            font-size: 0.6rem;
            color: var(--sub);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .hud-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
        }
        .hud-name { color: var(--fg); font-size: 1rem; }

        .progress-wrap {
            position: fixed;
            top: 80px; left: 40px; right: 40px;
            z-index: 5;
        }
        .progress-track {
            height: 2px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--green));
            width: 0%;
            transition: width .35s ease;
        }

        .question-wrap {
            max-width: 680px;
            width: 100%;
            margin-top: 60px;
            animation: qIn .35s ease;
        }
        @keyframes qIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            font-size: 1.45rem;
            font-weight: 500;
            line-height: 1.55;
            background: rgba(12,12,14,.75);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 28px 32px;
            margin-bottom: 24px;
            backdrop-filter: blur(12px);
            user-select: none;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option {
            padding: 16px 22px;
            background: rgba(12,12,14,.7);
            border: 1.5px solid var(--border);
            border-radius: 6px;
            color: var(--fg);
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all .22s;
        }
        .option:hover { background: rgba(77,171,247,.12); border-color: var(--accent); transform: translateY(-2px); }
        .option.selected { background: var(--accent); border-color: var(--accent); color: #0c0c0e; }

        .next-btn {
            margin-top: 28px;
            padding: 12px 32px;
            background: var(--accent);
            color: #0c0c0e;
            border: none;
            border-radius: 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            opacity: .3;
            pointer-events: none;
            transition: all .25s;
        }
        .next-btn.on { opacity: 1; pointer-events: auto; }
        .next-btn.on:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(77,171,247,.3); }

        /* result screen */
        #result-screen { z-index: 6; overflow-y: auto; padding: 60px 20px; }
        .result-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 60px 64px;
            width: 760px;
            max-width: 100%;
            text-align: center;
            animation: qIn .5s ease;
        }

        .result-title {
            font-size: 0.75rem;
            color: var(--sub);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .result-name {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 56px;
        }

        .iq-hero {
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: -4px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 12px;
        }
        .iq-category {
            font-size: 1.1rem;
            color: var(--fg);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .iq-sub { font-size: 0.8rem; color: var(--sub); margin-bottom: 56px; }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 48px;
        }
        .rs-box {
            background: rgba(255,255,255,.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px 20px;
        }
        .rs-label {
            font-size: 0.65rem;
            color: var(--sub);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .rs-value { font-size: 1.8rem; font-weight: 700; color: var(--accent); }

        .chart-box {
            background: rgba(255,255,255,.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 28px 24px;
            margin-bottom: 24px;
        }
        .chart-box canvas { width: 100% !important; height: 200px !important; }

        .desc-text {
            font-size: 0.88rem;
            color: var(--sub);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .retry-btn {
            padding: 12px 36px;
            background: var(--accent);
            color: #0c0c0e;
            border: none;
            border-radius: 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .25s;
        }
        .retry-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(77,171,247,.3); }
    </style>
</head>
<body>

<!-- NAME ENTRY -->
<div class="screen" id="name-screen">
    <div class="name-card">
        <h1>IQ Test</h1>
        <div class="tagline">What's your score?</div>
        <input class="name-input" id="name-input" type="text" placeholder="Enter your name" maxlength="32" autocomplete="off" spellcheck="false">
        <button class="start-btn" id="start-btn" disabled onclick="startTest()">Begin Test</button>
        <br>
        <button class="admin-btn" onclick="openAdmin()">Admin</button>
    </div>
</div>

<!-- ADMIN MODAL (shows tab switches per person - hidden from regular user) -->
<div class="modal-overlay" id="admin-modal">
    <div class="modal-card" id="admin-modal-card">
        <div id="admin-login-view">
            <h2>Admin Access</h2>
            <input class="name-input" id="admin-pass" type="password" placeholder="Password" autocomplete="off">
            <div class="modal-error" id="admin-error"></div>
            <button class="start-btn" style="margin-top:14px" onclick="checkAdminPass()">Enter</button>
            <br><button class="modal-close" onclick="closeAdmin()">Cancel</button>
        </div>
        <div id="admin-data-view" style="display:none;">
            <div class="admin-header-row">
                <h2 style="margin-bottom:0">📊 Results & Integrity</h2>
                <span class="admin-count" id="admin-count">0 entries</span>
            </div>
            <div class="admin-panel">
                <table class="admin-table" id="admin-table">
                    <thead>
                        <tr><th>Name</th><th>IQ</th><th>Correct</th><th>🚫 Tab switches</th><th>Time</th></tr>
                    </thead>
                    <tbody id="admin-tbody"></tbody>
                </table>
                <div class="admin-empty" id="admin-empty" style="display:none;">No results yet.</div>
            </div>
            <br><button class="modal-close" onclick="closeAdmin()">Close</button>
        </div>
    </div>
</div>

<!-- TEST SCREEN (no visible integrity warning) -->
<div class="screen hidden" id="test-screen">
    <div class="hud">
        <div class="hud-item">
            <span class="hud-label">Stopwatch</span>
            <span class="hud-value" id="stopwatch">00:00</span>
        </div>
        <div class="hud-item" style="align-items:center">
            <span class="hud-label">Name</span>
            <span class="hud-value hud-name" id="hud-name"></span>
        </div>
        <div class="hud-item" style="align-items:flex-end">
            <span class="hud-label">Question</span>
            <span class="hud-value"><span id="q-num">1</span><span style="color:var(--sub);font-size:1rem">/20</span></span>
        </div>
    </div>
    <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="question-wrap" id="question-wrap">
        <div class="question-text" id="q-text"></div>
        <div class="options-grid" id="options-grid"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next →</button>
    </div>
</div>

<!-- RESULT SCREEN -->
<div class="screen hidden" id="result-screen">
    <div class="result-card">
        <div class="result-title">Test Complete</div>
        <div class="result-name" id="result-name"></div>
        <div class="iq-hero" id="result-iq">—</div>
        <div class="iq-category" id="result-category"></div>
        <div class="iq-sub" id="result-time-line"></div>
        <div class="result-stats">
            <div class="rs-box"><div class="rs-label">Correct</div><div class="rs-value" id="rs-correct">0</div></div>
            <div class="rs-box"><div class="rs-label">Accuracy</div><div class="rs-value" id="rs-acc">0%</div></div>
            <div class="rs-box"><div class="rs-label">Time</div><div class="rs-value" id="rs-time">0:00</div></div>
        </div>
        <div class="chart-box"><canvas id="dist-chart"></canvas></div>
        <div class="desc-text" id="result-desc"></div>
        <button class="retry-btn" onclick="resetAll()">Try Again</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script>
// --------------------------------------------------------------
//  TAB SWITCH DETECTION (silent, only for admin)
// --------------------------------------------------------------
let tabSwitchCount = 0;
let isTestActive = false;

function startSilentTabMonitoring() {
    tabSwitchCount = 0;
    const handleVisibility = () => {
        if (!isTestActive) return;
        if (document.hidden) {
            tabSwitchCount++;
        }
    };
    document.addEventListener('visibilitychange', handleVisibility);
    window.__tabMonitorCleanup = () => {
        document.removeEventListener('visibilitychange', handleVisibility);
    };
}

function stopTabMonitoring() {
    if (window.__tabMonitorCleanup) window.__tabMonitorCleanup();
    window.__tabMonitorCleanup = null;
}

// --------------------------------------------------------------
//  DATA STORE (localStorage)
// --------------------------------------------------------------
function getResults() {
    try { return JSON.parse(localStorage.getItem('iq_results') || '[]'); } catch { return []; }
}
function saveResult(entry) {
    const r = getResults();
    r.push(entry);
    localStorage.setItem('iq_results', JSON.stringify(r));
}

// --------------------------------------------------------------
//  ADMIN PANEL (shows name, IQ, correct, TAB SWITCHES, time)
// --------------------------------------------------------------
const ADMIN_PASS = '123';

function openAdmin() {
    document.getElementById('admin-login-view').style.display = '';
    document.getElementById('admin-data-view').style.display  = 'none';
    document.getElementById('admin-pass').value = '';
    document.getElementById('admin-error').textContent = '';
    document.getElementById('admin-modal').classList.add('show');
    setTimeout(() => document.getElementById('admin-pass').focus(), 100);
}
function closeAdmin() {
    document.getElementById('admin-modal').classList.remove('show');
}
function checkAdminPass() {
    const v = document.getElementById('admin-pass').value;
    if (v === ADMIN_PASS) {
        showAdminData();
    } else {
        document.getElementById('admin-error').textContent = 'Incorrect password.';
    }
}
document.getElementById('admin-pass').addEventListener('keydown', e => { if (e.key === 'Enter') checkAdminPass(); });

function showAdminData() {
    document.getElementById('admin-login-view').style.display = 'none';
    document.getElementById('admin-data-view').style.display  = '';
    const results = getResults();
    document.getElementById('admin-count').textContent = results.length + ' entr' + (results.length === 1 ? 'y' : 'ies');
    const tbody = document.getElementById('admin-tbody');
    tbody.innerHTML = '';
    if (results.length === 0) {
        document.getElementById('admin-empty').style.display = '';
        document.getElementById('admin-table').style.display = 'none';
    } else {
        document.getElementById('admin-empty').style.display = 'none';
        document.getElementById('admin-table').style.display = '';
        results.slice().reverse().forEach((r, idx) => {
            const tr = document.createElement('tr');
            const switchCount = r.tabSwitches !== undefined ? r.tabSwitches : 0;
            tr.innerHTML = `
                <td style="font-weight:500;">${escHtml(r.name)}</td>
                <td><span class="iq-badge">${r.iq}</span></td>
                <td style="color:var(--sub)">${r.correct}/20</td>
                <td><span class="tab-switch-badge">${switchCount} ${switchCount === 1 ? 'switch' : 'switches'}</span></td>
                <td style="color:var(--sub)">${r.time}</td>
            `;
            tbody.appendChild(tr);
        });
    }
}
function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
document.getElementById('admin-modal').addEventListener('click', function(e) {
    if (e.target === this) closeAdmin();
});

// --------------------------------------------------------------
//  NAME ENTRY
// --------------------------------------------------------------
const nameInput = document.getElementById('name-input');
const startBtn  = document.getElementById('start-btn');
nameInput.addEventListener('input', () => {
    startBtn.disabled = nameInput.value.trim().length < 1;
});
nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !startBtn.disabled) startTest();
});

// --------------------------------------------------------------
//  IQ QUESTIONS (20)
// --------------------------------------------------------------
const QUESTIONS = [
    { q: "What is the next number in the sequence?\n2, 4, 8, 16, ?", opts: ["24","32","28","36"], a: 1 },
    { q: "If all roses are flowers and some flowers fade quickly, which statement must be true?", opts: ["All roses fade quickly","Some roses may fade quickly","No roses ever fade","All flowers are roses"], a: 1 },
    { q: "What number is missing?\n5, 10, 20, 40, ?, 160", opts: ["60","80","100","120"], a: 1 },
    { q: "A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball. How much does the ball cost?", opts: ["$0.10","$0.05","$0.15","$0.20"], a: 1 },
    { q: "Rearrange the letters in 'SILENT' — which word can you make?", opts: ["LISTEN","STOLEN","SINLET","TINSEL"], a: 0 },
    { q: "What is the next letter in the series?\nA, C, E, G, I, ?", opts: ["J","K","L","M"], a: 1 },
    { q: "All squares are rectangles. All rectangles are quadrilaterals. Therefore:", opts: ["All rectangles are squares","All squares are quadrilaterals","No squares are quadrilaterals","All quadrilaterals are rectangles"], a: 1 },
    { q: "What is the next number in the Fibonacci sequence?\n1, 1, 2, 3, 5, 8, 13, ?", opts: ["18","21","19","20"], a: 1 },
    { q: "Which number completes the analogy?\n9 : 3 :: 25 : ?", opts: ["4","5","7","10"], a: 1 },
    { q: "Which word does NOT belong with the others?", opts: ["Dog","Cat","Eagle","Truck"], a: 3 },
    { q: "What is 144 ÷ 12?", opts: ["10","11","12","13"], a: 2 },
    { q: "A right triangle has legs of 3 and 4. What is its area?", opts: ["6","7","10","12"], a: 0 },
    { q: "What number multiplied by itself equals 196?", opts: ["12","13","14","15"], a: 2 },
    { q: "You start with 8 apples, give away 3, then receive 5 more. How many do you have?", opts: ["8","10","13","16"], a: 1 },
    { q: "Which is a prime number?", opts: ["15","21","17","25"], a: 2 },
    { q: "A book is $20. It goes on sale for 25% off. What is the sale price?", opts: ["$10","$15","$18","$19"], a: 1 },
    { q: "If it takes 5 machines 5 minutes to make 5 widgets, how many minutes for 100 machines to make 100 widgets?", opts: ["100","50","10","5"], a: 3 },
    { q: "What comes next?\n2, 6, 12, 20, 30, ?", opts: ["36","40","42","44"], a: 2 },
    { q: "How many sides does a hexagon have?", opts: ["4","5","6","8"], a: 2 },
    { q: "If you flip a fair coin 3 times, how many possible distinct outcomes exist?", opts: ["3","6","8","12"], a: 2 },
];

// --------------------------------------------------------------
//  TEST STATE
// --------------------------------------------------------------
let userName = '';
let currentQ = 0;
let selectedAns = null;
let answers = [];
let swStart = null;
let swInterval = null;
let chartInst = null;

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

function startTest() {
    userName = nameInput.value.trim();
    if (!userName) return;
    
    // reset silent integrity tracker
    tabSwitchCount = 0;
    isTestActive = true;
    startSilentTabMonitoring();   // silently track tab switches (invisible to user)
    
    document.getElementById('hud-name').textContent = userName;
    currentQ = 0; answers = []; selectedAns = null;
    swStart = Date.now();
    startStopwatch();
    loadQuestion();
    showScreen('test-screen');
}

function startStopwatch() {
    clearInterval(swInterval);
    swInterval = setInterval(() => {
        if (!isTestActive) return;
        const s = Math.floor((Date.now() - swStart) / 1000);
        const m = Math.floor(s / 60);
        const sec = s % 60;
        document.getElementById('stopwatch').textContent =
            String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    }, 500);
}

function loadQuestion() {
    const q = QUESTIONS[currentQ];
    document.getElementById('q-text').textContent = q.q;
    document.getElementById('q-num').textContent = currentQ + 1;
    document.getElementById('progress-fill').style.width = (currentQ / 20 * 100) + '%';
    selectedAns = null;
    document.getElementById('next-btn').classList.remove('on');

    const grid = document.getElementById('options-grid');
    grid.innerHTML = q.opts.map((o, i) =>
        `<button class="option" onclick="pick(${i})">${o}</button>`
    ).join('');
}

function pick(i) {
    selectedAns = i;
    document.querySelectorAll('.option').forEach((b, idx) => {
        b.classList.toggle('selected', idx === i);
    });
    document.getElementById('next-btn').classList.add('on');
}

function nextQuestion() {
    if (selectedAns === null) return;
    answers.push(selectedAns);
    currentQ++;
    if (currentQ < 20) {
        loadQuestion();
    } else {
        finishTest();
    }
}

function finishTest() {
    clearInterval(swInterval);
    isTestActive = false;
    stopTabMonitoring();   // stop recording tab switches
    
    const elapsed = Math.floor((Date.now() - swStart) / 1000);
    const mm = Math.floor(elapsed / 60), ss = elapsed % 60;
    const timeStr = String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');

    let correct = 0;
    QUESTIONS.forEach((q, i) => { if (answers[i] === q.a) correct++; });

    const iq = 50 + correct * 5;
    const cat = iqCategory(iq);
    const acc = Math.round(correct / 20 * 100);
    
    // SAVE RESULT WITH TAB SWITCH COUNT (only visible in admin panel)
    saveResult({ 
        name: userName, 
        iq, 
        correct, 
        acc, 
        time: timeStr,
        tabSwitches: tabSwitchCount
    });

    document.getElementById('result-name').textContent = userName;
    document.getElementById('result-iq').textContent   = iq;
    document.getElementById('result-category').textContent = cat;
    document.getElementById('result-time-line').textContent = `Completed in ${timeStr}`;
    document.getElementById('rs-correct').textContent = correct + '/20';
    document.getElementById('rs-acc').textContent     = acc + '%';
    document.getElementById('rs-time').textContent    = timeStr;
    document.getElementById('result-desc').textContent = iqDesc(cat);

    showScreen('result-screen');
    renderChart(iq);
}

function iqCategory(iq) {
    if (iq >= 130) return 'Genius';
    if (iq >= 120) return 'Very Superior';
    if (iq >= 110) return 'Superior';
    if (iq >= 100) return 'High Average';
    if (iq >= 90)  return 'Average';
    if (iq >= 80)  return 'Low Average';
    if (iq >= 70)  return 'Below Average';
    return 'Very Low';
}

function iqDesc(cat) {
    const d = {
        'Genius':        'Exceptional intellectual ability. Rare cognitive talents, effortless complex problem-solving.',
        'Very Superior': 'Outstanding reasoning and analytical skills, well above the general population.',
        'Superior':      'Excellent logical thinking. You excel at pattern recognition and structured reasoning.',
        'High Average':  'Strong cognitive abilities and quick comprehension — above most people.',
        'Average':       'Solid cognitive abilities across most domains, right in line with the population mean.',
        'Low Average':   'Slightly below the average range. Complex tasks may take a bit more time.',
        'Below Average': 'Below the average range. Additional practice on reasoning tasks could help.',
        'Very Low':      'Significantly below average. Consider revisiting foundational reasoning exercises.',
    };
    return d[cat] || '';
}

function renderChart(userIQ) {
    if (chartInst) { chartInst.destroy(); chartInst = null; }
    const el = document.getElementById('dist-chart');
    const scores = Array.from({length: 101}, (_, i) => 50 + i);
    const gauss  = scores.map(s => {
        const z = (s - 100) / 15;
        return Math.exp(-.5 * z * z) / (15 * Math.sqrt(2 * Math.PI)) * 1000;
    });

    const lineDraw = {
        id: 'scoreLine',
        afterDatasetsDraw(chart) {
            const {ctx, chartArea: {top, height}, scales: {x}} = chart;
            const px = x.getPixelForValue(userIQ);
            ctx.save();
            ctx.strokeStyle = '#4dabf7'; ctx.lineWidth = 2.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, top + height); ctx.stroke();
            ctx.fillStyle = '#4dabf7';
            ctx.font = "11px 'JetBrains Mono'";
            ctx.textAlign = 'center';
            ctx.fillText('IQ ' + userIQ, px, top - 6);
            ctx.restore();
        }
    };

    chartInst = new Chart(el.getContext('2d'), {
        type: 'line',
        data: {
            labels: scores,
            datasets: [{
                data: gauss,
                borderColor: '#5a5a6e',
                backgroundColor: 'rgba(90,90,110,0.08)',
                borderWidth: 2, fill: true, tension: 0.4, pointRadius: 0,
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,.04)' }, ticks: { display: false } },
                x: { grid: { display: false }, ticks: { color: '#5a5a6e', font: { family: "'JetBrains Mono'", size: 10 } }, min: 50, max: 150 }
            }
        },
        plugins: [lineDraw]
    });
}

function resetAll() {
    if (chartInst) { chartInst.destroy(); chartInst = null; }
    clearInterval(swInterval);
    isTestActive = false;
    stopTabMonitoring();
    nameInput.value = '';
    startBtn.disabled = true;
    showScreen('name-screen');
}
</script>
</body>
</html>
